name: Validate language encoding

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-lang-encoding:
    name: validate-lang-encoding
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate .lang files
        run: python3 .github/scripts/validate_lang_encoding.py
